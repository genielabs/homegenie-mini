; Diagnostic only: normal platformio.ini and firmware builds are unchanged.
[platformio]
extra_configs = platformio.ini
build_dir = .pio/build-memory-nobt
libdeps_dir = .pio/libdeps-memory-nobt

[env:color-light-c3-memory-nobt]
extends = env:color-light-c3
platform = espressif32@8.0.0
build_flags = ${common.build_flags} -D BUILD_PLATFORM=\"espressif32@8.0.0\" -I examples -I src -D ESP32_C3
              -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
              -D BOARD_HAS_RGB_LED
              -D DEFAULT_CONFIG='{"sys-rb-n":"9","sys-sl-n":"-1","stld-typ":"82","stld-spd":"0","stld-pin":"10","leds-typ":"82","leds-spd":"0","leds-pin":"5","leds-cnt":"1","leds-rws":"1"}' -D DISABLE_BLUETOOTH
lib_ignore = BLE, BluetoothSerial, ESP32_BleSerial
